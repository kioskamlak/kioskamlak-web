name: Deploy Kiosk Amlak

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract web.zip
        run: |
          rm -rf site extracted
          mkdir -p site extracted
          unzip -q web.zip -d extracted

          if [ -f extracted/index.html ]; then
            cp -a extracted/. site/
          elif [ -f extracted/web/index.html ]; then
            cp -a extracted/web/. site/
          else
            INDEX=$(find extracted -name index.html -type f | head -n 1)
            if [ -z "$INDEX" ]; then
              echo "index.html not found"
              exit 1
            fi
            ROOT=$(dirname "$INDEX")
            cp -a "$ROOT"/. site/
          fi

          echo "Published files:"
          find site -maxdepth 2 -type f | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
